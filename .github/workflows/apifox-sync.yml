name: Apifox Sync

# 手动把 server/internal/api/openapi.yaml 同步到 Apifox 项目。
# 需要仓库 Secret：APIFOX_TOKEN（Apifox 系统级访问令牌）。
# 未配置令牌时只提示并成功退出，不阻塞其它流程。

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Apifox 项目 ID
        required: false
        default: '8912512'

permissions:
  contents: read

jobs:
  sync:
    name: Import OpenAPI into Apifox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check token
        id: token
        env:
          APIFOX_TOKEN: ${{ secrets.APIFOX_TOKEN }}
        run: |
          if [ -z "$APIFOX_TOKEN" ]; then
            echo "::warning::未配置 APIFOX_TOKEN，跳过同步。"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync openapi.yaml
        if: steps.token.outputs.configured == 'true'
        env:
          APIFOX_TOKEN: ${{ secrets.APIFOX_TOKEN }}
          APIFOX_PROJECT_ID: ${{ inputs.project_id }}
        run: bash server/scripts/sync-apifox.sh
